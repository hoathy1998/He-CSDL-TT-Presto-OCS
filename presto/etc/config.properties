coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery-server.enabled=true
discovery.uri=http://localhost:8080
query.max-memory=4GB
query.max-memory-per-node=4GB
query.max-total-memory-per-node=4500MB
# Giới hạn số split đọc đồng thời (PageSource đọc luồng Flight đồng bộ -> mỗi luồng worker giữ 1 luồng kết quả),
# tương đương độ song song đọc của engine thu nhỏ; tránh làm OCS (6 GB) hết bộ nhớ khi không pushdown.
task.max-worker-threads=8
# R4 (256 file): khi chỉ đẩy Filter, gom nhóm FINAL của Presto vượt bộ nhớ -> cho phép tràn ra đĩa (spill).
# Ở 64 file trở xuống không chạm giới hạn bộ nhớ nên spill không xảy ra, kết quả cũ không bị ảnh hưởng.
experimental.spill-enabled=true
experimental.spiller-spill-path=/tmp/presto-spill
experimental.max-spill-per-node=40GB
experimental.query-max-spill-per-node=40GB
